[package]
name = "escheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }
clap = { version = "4.6", features=["derive"]}
color-eyre = "0.6"
eyre = "0.6"
rand = "0.10"
rand_seeder = "0.5"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"]}
serde = {version = "1", features=["derive"]}
serde_json = "1"
ureq = "3.3"
